name: Build Android app
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Collect
        run: cp app/build/outputs/apk/debug/app-debug.apk ../earpiece.apk
      - uses: actions/upload-artifact@v4
        with:
          name: earpiece-apk
          path: earpiece.apk
      - name: Publish to the apk branch (so it can be pulled with git)
        working-directory: .
        run: |
          mkdir /tmp/out && cp earpiece.apk /tmp/out/ && cd /tmp/out
          echo "built from ${GITHUB_SHA} run ${GITHUB_RUN_NUMBER}" > BUILD.txt
          git init -q -b apk && git add . && git -c user.name=ci -c user.email=ci@local commit -q -m "APK ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk
