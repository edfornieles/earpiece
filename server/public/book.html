<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Choose your time — Mother</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --fg:#1d1d1b; --dim:#6d6a63; --line:#dedbd3; --accent:#1d1d1b; --ok:#417358; --bad:#a2522a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121211; --card:#1b1b1a; --fg:#ecebe7; --dim:#9c998f; --line:#34332f; --accent:#ecebe7; --ok:#7fb894; --bad:#e08a5f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width:620px; margin:0 auto; padding:40px 16px 80px; }
  h1 { font-size:28px; font-weight:600; margin:0 0 8px; } h2 { font-size:16px; font-weight:600; margin:22px 0 8px; }
  .dim { color:var(--dim); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:16px 0; }
  .card.mine { border-color:var(--ok); box-shadow:inset 4px 0 0 var(--ok); }
  .times { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px; }
  .times button { font:inherit; text-align:left; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .times button small { display:block; color:var(--dim); font-size:12px; }
  .times button[aria-pressed=true] { border-color:var(--accent); outline:2px solid var(--accent); }
  .times button:disabled { opacity:.45; cursor:default; }
  .bar { position:sticky; bottom:0; background:var(--bg); padding:14px 0 6px; display:flex; gap:10px; }
  .btn { font:inherit; font-weight:600; background:var(--accent); color:var(--bg); border:0; border-radius:10px; padding:13px 20px; cursor:pointer; flex:1; }
  .btn.quiet { background:transparent; color:var(--fg); border:1px solid var(--line); flex:0 0 auto; font-weight:500; }
  .btn:disabled { opacity:.45; cursor:default; }
  .err { color:var(--bad); min-height:1em; }
</style></head><body><main>
<h1 id="hi">Choose your time</h1>
<p class="dim" id="sub">Loading…</p>
<div id="mine"></div>
<div id="list"></div>
<p class="err" id="err" role="alert"></p>
<div class="bar" id="bar" hidden><button class="btn" id="book" disabled>Book this time</button></div>
</main><script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const T = new URLSearchParams(location.search).get('t') || '';
const day = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const end = (x) => { const m = +x.start.slice(0, 2) * 60 + +x.start.slice(3) + x.minutes; return `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
let data = null, pick = null;
async function call(body) {
  const r = await fetch('/signup-api/booking?t=' + encodeURIComponent(T), body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const d = await r.json(); if (!r.ok) throw Error(d.error || 'Something went wrong. Please try again.'); return d;
}
function render() {
  const d = data, today = new Date().toISOString().slice(0, 10);
  $('hi').textContent = `Hi ${d.name}`;
  $('sub').textContent = (d.booking ? 'Here is your booking. You can change or cancel it below.' : 'Choose a time that suits you.') + (d.page.where ? ' Where: ' + d.page.where : '');
  $('mine').innerHTML = d.booking ? `<div class="card mine"><b>You are booked</b><br>${esc(day(d.booking.date))}, ${d.booking.start}–${end(d.booking)}${d.booking.note ? ' · ' + esc(d.booking.note) : ''}
    <div style="margin-top:12px"><button class="btn quiet" id="cancel">Cancel my booking</button></div></div>` : '';
  const upcoming = d.slots.filter((x) => x.date >= today), days = [...new Set(upcoming.map((x) => x.date))];
  $('list').innerHTML = days.length ? (d.booking ? '<h2>Change to another time</h2>' : '') + days.map((dd) => `<h2>${esc(day(dd))}</h2><div class="times">${upcoming.filter((x) => x.date === dd).map((x) =>
    `<button data-id="${x.id}" aria-pressed="${pick === x.id}" ${x.mine || !x.left ? 'disabled' : ''}>${x.start}–${end(x)}<small>${x.mine ? 'your time' : x.left ? `${x.left} place${x.left === 1 ? '' : 's'} left` : 'full'}${x.note ? ' · ' + esc(x.note) : ''}</small></button>`).join('')}</div>`).join('')
    : '<div class="card">There are no times on the schedule yet. We will email you when there are.</div>';
  $('bar').hidden = !days.length; $('book').disabled = !pick; $('book').textContent = d.booking ? 'Change to this time' : 'Book this time';
  if ($('cancel')) $('cancel').onclick = async () => {
    if (!confirm('Cancel your booking?')) return;
    try { data = await call({ op: 'cancel' }); pick = null; render(); } catch (e) { $('err').textContent = e.message; }
  };
}
$('list').onclick = (e) => { const b = e.target.closest('button[data-id]'); if (!b || b.disabled) return; pick = b.dataset.id; $('err').textContent = ''; render(); };
$('book').onclick = async () => {
  $('book').disabled = true;
  try { data = await call({ op: 'book', slot: pick }); pick = null; render(); window.scrollTo(0, 0); $('sub').textContent = 'Booked. ' + (data.mail ? 'We have emailed you the details.' : '') ; }
  catch (e) { $('err').textContent = e.message; data = await call().catch(() => data); render(); }
};
call().then((d) => { data = d; render(); }).catch((e) => { $('hi').textContent = 'Choose your time'; $('sub').textContent = e.message; });
</script></body></html>
