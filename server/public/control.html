<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Control room</title>
<style>
  :root { --bg:#0e0e0e; --card:#171717; --line:#2a2a2a; --fg:#e8e6e1; --dim:#8a8780; --hot:#d9482b; --ok:#5fa36a; --ai:#7a8fd6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, system-ui, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); gap:16px; }
  header h1 { font-size:15px; font-weight:500; margin:0; }
  header nav { display:flex; gap:10px; align-items:center; }
  header a { color:var(--dim); text-decoration:none; font-size:13px; }
  .rec { color:var(--hot); font-size:12px; letter-spacing:.08em; }
  .rec::before { content:'●'; margin-right:6px; }
  main { display:grid; grid-template-columns: 1fr 330px; gap:18px; padding:18px 20px; }
  #cams { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px,1fr)); gap:12px; margin-bottom:16px; }
  #cams:empty { display:none; }
  .cam { position:relative; background:#000; border:1px solid var(--line); border-radius:10px; overflow:hidden; aspect-ratio:16/9; cursor:zoom-in; }
  .cam img { width:100%; height:100%; object-fit:contain; display:block; }
  .cam .tag { position:absolute; left:8px; top:8px; background:rgba(0,0,0,.6); padding:3px 8px; border-radius:6px; font-size:12px; }
  .cam .tag b { color:var(--hot); font-weight:500; margin-left:6px; }
  .cam .off { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; }
  #zoom { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:5; cursor:zoom-out; }
  #zoom img { max-width:96vw; max-height:92vh; }
  #grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px,1fr)); gap:14px; align-content:start; align-items:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .card.empty { color:var(--dim); border-style:dashed; justify-content:center; min-height:110px; text-align:center; }
  .card h2 { margin:0; font-size:15px; font-weight:500; display:flex; justify-content:space-between; align-items:baseline; }
  .card h2 small { color:var(--dim); font-weight:400; }
  .status { font-size:12px; color:var(--dim); min-height:16px; }
  .status.ai { color:var(--ai); } .status.hot { color:var(--hot); } .status.ok { color:var(--ok); }
  .meter { height:5px; background:#222; border-radius:3px; overflow:hidden; }
  .meter i { display:block; height:100%; width:0; background:var(--ok); transition:width .05s; }
  .row { display:flex; gap:8px; }
  button { font:inherit; border:1px solid var(--line); background:#222; color:var(--fg); border-radius:8px; padding:9px 12px; cursor:pointer; user-select:none; }
  button.grow { flex:1; }
  button.on { background:var(--hot); border-color:var(--hot); }
  button.aion { background:var(--ai); border-color:var(--ai); color:#0b0b0b; }
  button.muted { color:var(--dim); text-decoration:line-through; }
  button.quiet { color:var(--dim); }
  input, textarea { font:inherit; background:#101010; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:9px 10px; width:100%; }
  textarea { resize:vertical; font-size:13px; line-height:1.5; }
  .log { height:200px; overflow-y:auto; background:#101010; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; display:flex; flex-direction:column; gap:6px; }
  .log div b { font-weight:500; margin-right:6px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
  .log .participant b { color:var(--ok); } .log .ai b { color:var(--ai); } .log .director b { color:var(--hot); } .log .note { color:var(--dim); font-style:italic; } .log .err { color:#e88; font-size:12px; }
  aside { display:flex; flex-direction:column; gap:14px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .panel h3 { margin:0; font-size:12px; color:var(--dim); font-weight:500; text-transform:uppercase; letter-spacing:.06em; display:flex; justify-content:space-between; }
  #qr svg { width:150px; height:auto; background:#fff; border-radius:8px; }
  #link { word-break:break-all; color:var(--dim); font-size:11px; }
  .tabs { display:flex; gap:6px; } .tabs button { padding:5px 9px; font-size:12px; } .tabs button.sel { background:var(--fg); color:#000; }
  kbd { background:#222; border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:11px; }
  #gate { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:9; }
  #gate button { font-size:17px; padding:16px 28px; background:var(--fg); color:#000; }
  .hint { color:var(--dim); font-size:12px; }
  #brief { min-height:200px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#222; border:1px solid var(--line); padding:8px 14px; border-radius:8px; display:none; }
</style>
</head>
<body>
<header>
  <h1>Control room <span id="mock" class="hint"></span></h1>
  <nav>
    <button id="mark" title="Drop a marker on the timeline (M)">Mark <kbd>M</kbd></button>
    <a id="lib" target="_blank">Library ↗</a>
    <span class="rec">REC</span>
  </nav>
</header>
<main>
  <section>
    <div id="cams"></div>
    <div id="grid"></div>
  </section>
  <aside>
    <div class="panel">
      <h3>Your mic</h3>
      <div class="meter"><i id="mymeter"></i></div>
      <button id="all">Hold to talk to everyone</button>
      <input id="speakall" placeholder="Type a line → every phone hears it in the voice (Enter)">
      <div class="hint">Hold <kbd>space</kbd> = everyone · hold <kbd>1</kbd>–<kbd>4</kbd> = one phone · <kbd>L</kbd> latches talk-to-all · <kbd>M</kbd> drops a marker. Talking cuts the AI off; it carries on after you stop.</div>
    </div>
    <div class="panel">
      <h3>Phones</h3>
      <div class="tabs" id="tabs"></div>
      <div id="qr"><span class="hint">waiting for tunnel…</span></div>
      <div id="link"></div>
      <div class="hint">Open this on the phone, then Chrome menu → Add to Home screen.</div>
    </div>
    <div class="panel">
      <h3>AI brief <span id="briefstate"></span></h3>
      <textarea id="brief" spellcheck="false"></textarea>
      <button id="savebrief">Save brief</button>
    </div>
    <div class="panel">
      <h3>Session</h3>
      <div id="session" class="hint"></div>
    </div>
  </aside>
</main>
<div id="zoom"><img></div>
<div id="toast"></div>
<div id="gate"><button id="go">Start control room</button></div>

<script src="audio.js"></script>
<script>
const KEY = new URLSearchParams(location.search).get('k');
const $ = (id) => document.getElementById(id);
const MAX = 4;
let ctx, mic, ws, myLevel = 0, talkTarget = null, latched = false, info = null;
const people = new Map();
$('lib').href = '/library?k=' + KEY;

function toast(t) { $('toast').textContent = t; $('toast').style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => ($('toast').style.display = 'none'), 1800); }
function person(id) {
  let p = people.get(id);
  if (!p) {
    const gain = ctx.createGain(); gain.connect(ctx.destination);
    p = { id, gain, player: makePlayer(ctx, gain), listening: true, lines: [], mode: 'auto', st: {}, waiting: true };
    people.set(id, p);
  }
  return p;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

// ---- cameras ----
function renderCams(list) {
  const box = $('cams');
  for (const c of list) {
    let el = box.querySelector(`[data-id="${c.id}"]`);
    if (!el) {
      el = document.createElement('div'); el.className = 'cam'; el.dataset.id = c.id;
      el.innerHTML = `<img alt=""><div class="off">connecting…</div><div class="tag"></div>`;
      el.querySelector('img').src = `/cam/${c.id}.mjpg?k=${KEY}`;
      el.onclick = () => { $('zoom').querySelector('img').src = `/cam/${c.id}.mjpg?k=${KEY}`; $('zoom').style.display = 'flex'; };
      box.appendChild(el);
    }
    el.querySelector('.tag').innerHTML = esc(c.name) + (c.recording ? '<b>● REC</b>' : '<b style="color:var(--dim)">not recording</b>');
    el.querySelector('.off').style.display = c.live ? 'none' : 'flex';
    if (!c.live) {   // reconnect the picture if the feed stalled
      el.querySelector('.off').textContent = 'no picture — reconnecting…';
      const img = el.querySelector('img'); if (!el.retry || Date.now() - el.retry > 5000) { el.retry = Date.now(); img.src = `/cam/${c.id}.mjpg?k=${KEY}&r=${el.retry}`; }
    }
  }
}
$('zoom').onclick = () => { $('zoom').style.display = 'none'; $('zoom').querySelector('img').src = ''; };

// ---- phones ----
function renderGrid(list) {
  for (const p of people.values()) p.connected = false;
  for (const { id, name, mode, waiting } of list) { const p = person(id); Object.assign(p, { name, mode, waiting, connected: true }); }
  const grid = $('grid'); grid.innerHTML = '';
  for (let id = 1; id <= MAX; id++) {
    const p = people.get(id);
    const el = document.createElement('div');
    if (!p || !p.connected) { el.className = 'card empty'; el.textContent = `Phone ${id} — not connected`; grid.appendChild(el); p && (p.el = null); continue; }
    el.className = 'card';
    el.innerHTML = `
      <h2><span class="who"></span> <small>Phone ${id}</small></h2>
      <div class="status"></div>
      <div class="meter"><i></i></div>
      <div class="row">
        <button class="grow talk">Hold to talk</button>
        <button class="listen ${p.listening ? '' : 'muted'}">Listen</button>
      </div>
      <div class="row">
        <button class="grow aimode"></button>
        <button class="nudge">Next direction</button>
      </div>
      <input class="speak" placeholder="Type a line → spoken word-for-word in the voice (Enter)">
      <input class="instruct" placeholder="Private note to the AI (it rephrases), then Enter">
      <div class="log"></div>
      <button class="quiet endp">End participant → ready for next</button>`;
    p.el = el; p.meter = el.querySelector('.meter i'); p.log = el.querySelector('.log'); p.status = el.querySelector('.status');
    bindHold(el.querySelector('.talk'), id);
    el.querySelector('.listen').onclick = (e) => { p.listening = !p.listening; p.gain.gain.value = p.listening ? 1 : 0; e.target.classList.toggle('muted', !p.listening); };
    el.querySelector('.aimode').onclick = () => ws.send(JSON.stringify({ type: 'mode', id, mode: p.mode === 'auto' ? 'off' : 'auto' }));
    el.querySelector('.nudge').onclick = () => ws.send(JSON.stringify({ type: 'nudge', id }));
    el.querySelector('.endp').onclick = () => { if (confirm(`End ${p.name || 'this participant'} on Phone ${id}? The phone goes back to the consent screen.`)) ws.send(JSON.stringify({ type: 'end', id })); };
    const spk = el.querySelector('.speak');
    spk.onkeydown = (e) => { if (e.key === 'Enter' && spk.value.trim()) { ws.send(JSON.stringify({ type: 'speak', id, text: spk.value.trim() })); spk.value = ''; } e.stopPropagation(); };
    spk.onkeyup = (e) => e.stopPropagation();
    const ins = el.querySelector('.instruct');
    ins.onkeydown = (e) => { if (e.key === 'Enter' && ins.value.trim()) { ws.send(JSON.stringify({ type: 'instruct', id, text: ins.value.trim() })); ins.value = ''; } e.stopPropagation(); };
    ins.onkeyup = (e) => e.stopPropagation();
    for (const l of p.lines) appendLine(p, l, true);
    paintState(p);
    grid.appendChild(el);
  }
}

function paintState(p) {
  if (!p.el) return;
  p.el.querySelector('.who').textContent = p.waiting ? 'Waiting for next participant' : (p.name || 'Participant');
  p.el.querySelector('.endp').style.display = p.waiting ? 'none' : '';
  const b = p.el.querySelector('.aimode');
  b.textContent = p.mode === 'auto' ? 'AI directing — on' : 'AI off';
  b.classList.toggle('aion', p.mode === 'auto');
  const s = p.st; let txt = '', cls = 'status';
  if (s.hidden) { txt = '⚠ phone screen is off — they can’t hear anything'; cls += ' hot'; }
  else if (s.headsetDropped) { txt = '⚠ headset out of range — AI paused until it reconnects'; cls += ' hot'; }
  else if (p.waiting) txt = 'phone is on the consent screen';
  else if (s.held) { txt = 'you are talking'; cls += ' hot'; }
  else if (s.headset === false && !p.waiting && !s.speaking && !s.thinking) { txt = 'no headset on the phone — sound comes from the phone itself'; cls += ' hot'; }
  else if (s.speaking) { txt = 'AI speaking…'; cls += ' ai'; }
  else if (s.thinking) { txt = 'AI thinking…'; cls += ' ai'; }
  else if (s.listening) { txt = 'participant speaking…'; cls += ' ok'; }
  else txt = p.mode === 'auto' ? 'AI listening' : 'AI off — you are directing';
  p.status.textContent = txt; p.status.className = cls;
}

function appendLine(p, l, replay) {
  if (!replay) p.lines.push(l);
  if (!p.log) return;
  const d = document.createElement('div');
  if (l.who === 'error') { d.className = 'err'; d.textContent = '⚠ ' + l.text; }
  else if (l.who === 'note') { d.className = 'note'; d.textContent = l.text; }
  else { d.className = l.who === 'typed' ? 'ai' : l.who; d.innerHTML = `<b>${l.who === 'ai' ? 'AI' : l.who === 'typed' ? 'Voice (typed)' : l.who === 'director' ? 'You' : esc(p.name || 'Them')}</b>${esc(l.text)}`; }
  const atBottom = p.log.scrollHeight - p.log.scrollTop - p.log.clientHeight < 40;
  p.log.appendChild(d);
  if (atBottom || replay) p.log.scrollTop = p.log.scrollHeight;
}

function setTalk(target) {
  if (talkTarget === target) return;
  if (talkTarget !== null) ws.send(JSON.stringify({ type: 'talk', target: talkTarget, on: false }));
  talkTarget = target;
  if (target !== null) ws.send(JSON.stringify({ type: 'talk', target, on: true }));
  $('all').classList.toggle('on', target === 0);
}
function bindHold(btn, target) {
  const down = (e) => { e.preventDefault(); setTalk(target); btn.classList.add('on'); };
  const up = () => { if (!latched || target !== 0) setTalk(null); btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up);
}
function mark() { const t = prompt('Marker label (optional):', '') ; if (t === null) return; ws.send(JSON.stringify({ type: 'mark', text: t || 'Mark' })); }
$('mark').onclick = mark;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?role=control&k=${KEY}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => ws.send(JSON.stringify({ type: 'getBrief' }));
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') {
      const id = new Uint16Array(e.data, 0, 1)[0];
      const p = people.get(id); if (p) p.player.push(new Int16Array(e.data.slice(2)));
      return;
    }
    const m = JSON.parse(e.data);
    if (m.type === 'participants') renderGrid(m.list);
    if (m.type === 'state') { const p = person(m.id); Object.assign(p, { mode: m.mode, waiting: m.waiting, name: m.name, st: m }); paintState(p); }
    if (m.type === 'transcript') appendLine(person(m.id), m);
    if (m.type === 'error') appendLine(person(m.id), { who: 'error', text: m.text });
    if (m.type === 'cameras') renderCams(m.list);
    if (m.type === 'marked') toast(`Marker at ${m.t}s: ${m.text}`);
    if (m.type === 'brief') {
      if (!m.saved || document.activeElement !== $('brief')) $('brief').value = m.text;
      $('briefstate').textContent = m.saved ? 'saved' : ''; setTimeout(() => ($('briefstate').textContent = ''), 2000);
    }
  };
  ws.onclose = () => setTimeout(connect, 1000);
}

function showDevice(n) {
  [...$('tabs').children].forEach((b, i) => b.classList.toggle('sel', i + 1 === n));
  const d = info.devices[n - 1];
  if (d && d.qr) { $('qr').innerHTML = d.qr; $('link').textContent = d.url; }
}
async function loadInfo() {
  info = await (await fetch('/api/info?k=' + KEY)).json();
  $('session').innerHTML = `${esc(info.name)}<br>${esc(info.session)}`;
  if (info.mock) $('mock').textContent = '· MOCK AI';
  renderCams(info.cameras);
  if (!$('tabs').children.length) info.devices.forEach((d) => { const b = document.createElement('button'); b.textContent = 'Phone ' + d.device; b.onclick = () => showDevice(d.device); $('tabs').appendChild(b); });
  if (info.devices[0]?.qr) showDevice(1); else setTimeout(loadInfo, 1500);
}
$('speakall').onkeydown = (e) => { if (e.key === 'Enter' && e.target.value.trim()) { ws.send(JSON.stringify({ type: 'speak', id: 0, text: e.target.value.trim() })); e.target.value = ''; } e.stopPropagation(); };
$('speakall').onkeyup = (e) => e.stopPropagation();
$('savebrief').onclick = () => ws.send(JSON.stringify({ type: 'saveBrief', text: $('brief').value }));

$('go').onclick = async () => {
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule('worklets.js');
  mic = await openMic(ctx);
  mic.onChunk((f) => {
    myLevel = Math.max(myLevel * 0.8, rms(f));
    if (talkTarget === null || !ws || ws.readyState !== 1) return;
    const i16 = floatToInt16(f);
    const buf = new ArrayBuffer(2 + i16.byteLength);
    new Uint16Array(buf, 0, 1)[0] = talkTarget;
    new Int16Array(buf, 2).set(i16);
    ws.send(buf);
  });
  await ctx.resume();
  $('gate').remove();
  bindHold($('all'), 0);
  connect(); loadInfo();
  (function draw() {
    myLevel *= 0.92;
    $('mymeter').style.width = Math.min(100, myLevel * 600) + '%';
    $('mymeter').style.background = talkTarget !== null ? 'var(--hot)' : 'var(--ok)';
    for (const p of people.values()) if (p.meter) p.meter.style.width = Math.min(100, p.player.level() * 600) + '%';
    requestAnimationFrame(draw);
  })();
};

const typing = () => ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
document.addEventListener('keydown', (e) => {
  if (e.repeat || !ws || typing()) return;
  if (e.code === 'Space') { e.preventDefault(); setTalk(0); }
  if (/^Digit[1-4]$/.test(e.code)) setTalk(Number(e.code.slice(5)));
  if (e.code === 'KeyL') { latched = !latched; setTalk(latched ? 0 : null); }
  if (e.code === 'KeyM') { e.preventDefault(); mark(); }
  if (e.code === 'Escape') $('zoom').click();
});
document.addEventListener('keyup', (e) => {
  if (!ws || typing()) return;
  if (e.code === 'Space' || /^Digit[1-4]$/.test(e.code)) setTalk(latched ? 0 : null);
});
</script>
</body>
</html>
