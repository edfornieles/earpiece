<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<style>
  :root { --bg:#0e0e0e; --card:#171717; --line:#2a2a2a; --fg:#e8e6e1; --dim:#8a8780; --hot:#d9482b; --ok:#5fa36a; --ai:#7a8fd6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, system-ui, sans-serif; }
  header { padding:14px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:15px; font-weight:500; margin:0; }
  main { display:grid; grid-template-columns: 340px 1fr; height:calc(100vh - 50px); }
  #list { border-right:1px solid var(--line); overflow-y:auto; }
  #search { margin:12px; width:calc(100% - 24px); }
  .item { padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover, .item.sel { background:var(--card); }
  .item b { font-weight:500; display:block; }
  .item span { color:var(--dim); font-size:12px; }
  .live { color:var(--hot); font-size:11px; margin-left:6px; }
  #detail { overflow-y:auto; padding:20px 26px; }
  #detail h2 { font-size:18px; font-weight:500; margin:0 0 4px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 18px; }
  button { font:inherit; border:1px solid var(--line); background:#222; color:var(--fg); border-radius:8px; padding:8px 12px; cursor:pointer; }
  input { font:inherit; background:#101010; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  h3 { font-size:12px; color:var(--dim); font-weight:500; text-transform:uppercase; letter-spacing:.06em; margin:22px 0 8px; }
  .files { display:grid; gap:6px; }
  .file { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  .file span { flex:1; word-break:break-all; } .file small { color:var(--dim); }
  .file audio { height:28px; width:260px; }
  pre { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; font:13px/1.55 ui-monospace, Menlo, monospace; }
  .hint { color:var(--dim); font-size:12px; }
  mark { background:#5a4a12; color:inherit; }
</style>
</head>
<body>
<header><h1>Library</h1><span class="hint">Every session is a folder in <code>recordings/</code>. Import <code>exports/timeline.fcpxml</code> into Resolve or Premiere to get everything lined up.</span></header>
<main>
  <section id="list"><input id="search" placeholder="Search names, titles, transcripts…"></section>
  <section id="detail"><p class="hint">Choose a session.</p></section>
</main>
<script>
const KEY = new URLSearchParams(location.search).get('k');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const api = (p, opts) => fetch(`/api/${p}${p.includes('?') ? '&' : '?'}k=${KEY}`, opts).then((r) => r.json());
const size = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.ceil(b / 1e3) + ' KB';
const dur = (s) => s ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : '';
let sessions = [], current = null, texts = {};

async function load() {
  sessions = await api('sessions');
  render();
  const want = location.hash.slice(1) || sessions[0]?.name;
  if (want) open(want);
}
function render() {
  const q = $('search').value.toLowerCase();
  [...document.querySelectorAll('.item')].forEach((e) => e.remove());
  for (const s of sessions) {
    const hay = (s.name + ' ' + s.title + ' ' + s.participants.join(' ') + ' ' + (texts[s.name] || '')).toLowerCase();
    if (q && !hay.includes(q)) continue;
    const el = document.createElement('div');
    el.className = 'item' + (s.name === current ? ' sel' : '');
    el.innerHTML = `<b>${esc(s.title || s.name)}${s.live ? '<span class="live">● recording</span>' : ''}</b><span>${esc(new Date(s.start).toLocaleString())}${s.duration ? ' · ' + dur(s.duration) : ''}${s.participants.length ? ' · ' + esc(s.participants.join(', ')) : ''}${s.cameras ? ' · ' + s.cameras + ' cam' : ''}</span>`;
    el.onclick = () => open(s.name);
    $('list').appendChild(el);
  }
}
$('search').oninput = async () => {
  // pull transcripts once so search covers what people said
  for (const s of sessions) if (!(s.name in texts)) texts[s.name] = (await api('session?s=' + encodeURIComponent(s.name))).transcript || '';
  render();
};

async function open(name) {
  current = name; location.hash = name; render();
  const d = await api('session?s=' + encodeURIComponent(name));
  texts[name] = d.transcript || '';
  const s = d.session || {};
  const f = (p) => `/files/${encodeURIComponent(name)}/${p.split('/').map(encodeURIComponent).join('/')}?k=${KEY}`;
  const group = (pred) => d.files.filter(pred).map((x) => `
    <div class="file"><span>${esc(x.path)}</span><small>${size(x.size)}</small>
    ${x.path.endsWith('.wav') ? `<audio controls preload="none" src="${f(x.path)}"></audio>` : `<a href="${f(x.path)}" target="_blank" style="color:var(--dim)">open</a>`}</div>`).join('') || '<span class="hint">none</span>';
  const live = sessions.find((x) => x.name === name)?.live;
  $('detail').innerHTML = `
    <h2>${esc(s.title || name)}</h2>
    <div class="hint">${esc(new Date(s.start_iso).toLocaleString())}${s.end_iso ? ' → ' + esc(new Date(s.end_iso).toLocaleTimeString()) : ''} · ${esc(name)}</div>
    <div class="row">
      <input id="title" placeholder="Title for this session" value="${esc(s.title || '')}"><button id="savetitle">Save title</button>
      <button id="openf">Open folder in Finder</button>
      <button id="reexp" ${live ? 'disabled title="exports when the session ends"' : ''}>Rebuild exports</button>
    </div>
    ${(s.participants || []).length ? `<h3>Participants</h3><div>${s.participants.map((p) => `Phone ${p.phone}: <b>${esc(p.name || 'unnamed')}</b> <span class="hint">${Math.round(p.start)}s${p.end != null ? '–' + Math.round(p.end) + 's' : ''}</span>`).join('<br>')}</div>` : ''}
    <h3>Catalogue <span class="hint" id="catstate"></span></h3>
    <div class="row"><button id="recat" ${live ? 'disabled title="built when the session ends"' : ''}>${d.catalogue ? 'Rebuild catalogue' : 'Build catalogue'}</button>
      <span class="hint">${d.catalogue?.counts ? Object.entries(d.catalogue.counts).map(([k, n]) => `${n} ${k === 'thumbs' ? 'stills' : k === 'sheets' ? 'contact sheets' : 'camera proxies'}`).join(' · ') : ''}</span></div>
    <div class="files">${group((x) => x.path.startsWith('catalogue/') && !x.path.endsWith('status.json') && !x.path.endsWith('log.txt'))}</div>
    <h3>Edit exports</h3><div class="files">${group((x) => x.path.startsWith('exports/'))}</div>
    <h3>Video</h3><div class="files">${group((x) => x.path.startsWith('video/'))}</div>
    <h3>Audio</h3><div class="files">${group((x) => x.path.startsWith('audio/'))}</div>
    <h3>Transcript</h3><pre>${esc(d.transcript || '—')}</pre>`;
  const c = d.catalogue;
  $('catstate').textContent = !c ? (live ? '— built when the session ends' : '— not built yet') : c.state === 'running' ? `— working: ${c.step}…` : c.state === 'failed' ? `— failed: ${c.error || ''}` : `— ready${c.utterances != null ? ` · ${c.utterances} lines` : ''}${c.notes?.length ? ' · ' + c.notes.join('; ') : ''}`;
  clearTimeout(window.catTimer);
  if (c && c.state === 'running') window.catTimer = setTimeout(() => current === name && open(name), 3000);
  $('recat').onclick = async () => { const r = await api('catalogue?s=' + encodeURIComponent(name)); if (r.error) alert(r.error); setTimeout(() => open(name), 500); };
  $('openf').onclick = () => api('open?s=' + encodeURIComponent(name));
  $('reexp').onclick = async () => { const r = await api('export?s=' + encodeURIComponent(name)); if (r.error) alert(r.error); open(name); };
  $('savetitle').onclick = async () => { await api('title?s=' + encodeURIComponent(name), { method: 'POST', body: JSON.stringify({ title: $('title').value }) }); sessions = await api('sessions'); render(); };
}
load();
</script>
</body>
</html>
