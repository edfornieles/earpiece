<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Registrations — Mother</title>
<style>
  :root { --bg:#0e0e0e; --card:#171717; --line:#2a2a2a; --fg:#e8e6e1; --dim:#8a8780; --hot:#d9482b; --ok:#5fa36a; --ai:#7a8fd6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:3; background:var(--bg); padding:12px 22px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; font-weight:500; margin:0; }
  header nav { margin-left:auto; display:flex; gap:14px; } header nav a { color:var(--dim); text-decoration:none; font-size:13px; }
  input, select, textarea, button { font:inherit; background:#151515; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  button { cursor:pointer; background:#222; } button:hover { border-color:#444; } button.primary { background:var(--fg); color:#000; border-color:var(--fg); }
  main { padding:18px 22px 60px; max-width:1300px; }
  .warn { background:#2a1712; border:1px solid #5a2a1e; color:#f0b9ad; border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(360px,1fr)); gap:14px; }
  .p { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .top { display:flex; gap:12px; }
  .top img { width:110px; height:140px; object-fit:cover; border-radius:10px; background:#000; cursor:zoom-in; flex:none; }
  .top .f { flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .top .f input { width:100%; }
  .num { color:#e3c45a; font-weight:500; }
  .meta { color:var(--dim); font-size:12px; }
  .yes { color:var(--ok); } .no { color:var(--dim); }
  textarea { width:100%; min-height:40px; resize:vertical; font-size:13px; }
  .sess { display:flex; flex-direction:column; gap:4px; font-size:13px; }
  .sess a { color:var(--fg); } .sess .x { color:var(--dim); cursor:pointer; margin-left:6px; font-size:12px; }
  .link { border-top:1px solid var(--line); padding-top:8px; display:none; flex-direction:column; gap:6px; }
  .p.linking .link { display:flex; }
  .visit { display:flex; align-items:center; gap:8px; background:#111; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px; }
  .visit span { flex:1; } .visit button { padding:4px 9px; font-size:12px; }
  .empty { color:var(--dim); padding:30px 0; }
  #zoom { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:9; cursor:zoom-out; }
  #zoom img { max-width:92vw; max-height:92vh; border-radius:8px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#222; border:1px solid var(--line); padding:8px 14px; border-radius:8px; display:none; z-index:10; }
</style>
</head>
<body>
<header>
  <h1>Registrations</h1>
  <input id="q" placeholder="Search name, email, number…" style="width:260px">
  <select id="show"><option value="all">Everyone</option><option value="waiting">Not in a session yet</option><option value="today">Registered today</option></select>
</header>
<main>
  <div id="warn"></div>
  <div class="grid" id="grid"><div class="empty">Loading…</div></div>
</main>
<div id="zoom"><img alt=""></div>
<div id="toast"></div>
<script>
const KEY = new URLSearchParams(location.search).get('k');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const api = (p, opts) => fetch(`/api/${p}${p.includes('?') ? '&' : '?'}k=${KEY}`, opts).then((r) => r.json());
const post = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body) });
function toast(t) { $('toast').textContent = t; $('toast').style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => ($('toast').style.display = 'none'), 2200); }

let regs = [], sessions = [];
const when = (iso) => new Date(iso).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const t = (v) => v == null ? '…' : `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;

async function load() {
  const [r, s] = await Promise.all([api('registry'), api('sessions')]);
  regs = r.list; sessions = s;
  $('warn').innerHTML = r.consent?.draft ? '<div class="warn">People are signing the <b>draft</b> consent form (consent.example.md). Save your checked version as <b>consent.md</b> in the earpiece folder.</div>' : '';
  render();
}
function render() {
  const q = $('q').value.trim().toLowerCase(), show = $('show').value, today = new Date().toDateString();
  const list = regs.filter((x) => (!q || `${x.name} ${x.email} #${x.number} ${x.notes}`.toLowerCase().includes(q))
    && (show !== 'waiting' || !x.sessions.length) && (show !== 'today' || new Date(x.registered).toDateString() === today));
  const title = (name) => { const s = sessions.find((y) => y.name === name); return s ? (s.title || new Date(s.start).toLocaleString()) : name; };
  $('grid').innerHTML = list.map((x) => `<div class="p" data-pid="${x.pid}">
    <div class="top"><img src="${x.photo}?k=${KEY}" alt="">
      <div class="f">
        <div><span class="num">#${x.number}</span> <span class="meta">${esc(when(x.registered))}</span></div>
        <input class="n" value="${esc(x.name)}" placeholder="Name">
        <input class="e" value="${esc(x.email)}" placeholder="Email">
        <div class="meta">Consent signed · <a href="/participants/${x.pid}/consent.md?k=${KEY}" target="_blank" style="color:var(--dim)">read what they agreed to</a><br>
          Face matching: ${x.face ? '<span class="yes">agreed</span>' : '<span class="no">not agreed — link footage by hand</span>'}</div>
      </div></div>
    <textarea class="o" placeholder="Notes">${esc(x.notes)}</textarea>
    <div class="sess">${x.sessions.length ? x.sessions.map((s) => `<div>In <a href="/files?k=${KEY}&s=${encodeURIComponent(s.session)}" target="_blank">${esc(title(s.session))}</a> <span class="meta">(${esc(s.how)})</span><span class="x" data-unlink="${esc(s.session)}" title="Remove from this session (only if they weren't on a phone in it)">remove</span></div>`).join('') : '<span class="meta">Not in a session yet</span>'}</div>
    <div style="display:flex;gap:8px"><button class="open" style="flex:1">Connect to a session…</button><button class="delreg" style="color:#e88" title="Delete this registration (e.g. if they ask to be removed)">Delete…</button></div>
    <div class="link">
      <select class="ss"><option value="">Choose a session…</option>${sessions.map((s) => `<option value="${esc(s.name)}">${esc((s.title ? s.title + ' — ' : '') + new Date(s.start).toLocaleString())}${s.live ? ' (now)' : ''}</option>`).join('')}</select>
      <div class="visits"></div>
    </div></div>`).join('') || '<div class="empty">No registrations yet. People register by scanning the code on the welcome screen.</div>';
}
$('q').oninput = render; $('show').onchange = render;

$('grid').addEventListener('change', async (e) => {
  const card = e.target.closest('.p'); if (!card) return;
  const pid = card.dataset.pid;
  if (e.target.matches('.n, .e, .o')) {
    const r = await post('registry-update', { pid, name: card.querySelector('.n').value.trim(), email: card.querySelector('.e').value.trim(), notes: card.querySelector('.o').value });
    if (r.error) return toast(r.error);
    Object.assign(regs.find((x) => x.pid === pid), r.person); toast('Saved');
  }
  if (e.target.matches('.ss')) showVisits(card, e.target.value);
});
async function showVisits(card, s) {
  const box = card.querySelector('.visits'); box.innerHTML = '';
  if (!s) return;
  const d = await api('session?s=' + encodeURIComponent(s));
  const folk = Object.fromEntries((d.people || []).flatMap((x) => [x.pid, ...(x.aliases || [])].map((id) => [id, x])));
  const visits = (d.session.participants || []).map((v, i) => {
    const who = folk[v.pid], mine = v.pid === card.dataset.pid;
    return `<div class="visit"><span>Phone ${v.phone} · <b>${esc(who?.name || v.name || 'unnamed')}</b> · ${t(v.start)}–${t(v.end)} ${who?.registered ? (mine ? '<span class="yes">— this person</span>' : '<span class="meta">(registered)</span>') : '<span class="meta">(not registered)</span>'}</span>${mine ? '' : `<button data-visit="${i}">This was them</button>`}</div>`;
  }).join('');
  box.innerHTML = (visits || '<div class="meta">Nobody was on a phone in this session.</div>') +
    `<div class="visit"><span>They were there, but not on a phone (e.g. watching, or seen on camera)</span><button data-visit="-1">Add them</button></div>`;
  box.dataset.session = s;
}
$('grid').addEventListener('click', async (e) => {
  const img = e.target.closest('.top img');
  if (img) { $('zoom').querySelector('img').src = img.src; $('zoom').style.display = 'flex'; return; }
  const card = e.target.closest('.p'); if (!card) return;
  const pid = card.dataset.pid;
  if (e.target.matches('.open')) { card.classList.toggle('linking'); return; }
  if (e.target.matches('.delreg')) {
    const x = regs.find((r) => r.pid === pid);
    if (!confirm(`Delete the registration of ${x.name} (#${x.number})?\n\nTheir name, email, photo and signed consent are removed — here and from ${x.sessions.length ? 'the ' + x.sessions.length + ' session(s) they were in' : 'any session'} — and go to the Trash (restorable until you empty it).\n\nRecordings of them (their voice on the phone tracks, camera footage) stay: delete those files from the session's Files page if needed.`)) return;
    const r = await post('delete-registration', { pid });
    if (r.error) return toast('⚠ ' + r.error);
    toast('Registration moved to the Trash'); await load(); return;
  }
  if (e.target.dataset.visit !== undefined) {
    const s = card.querySelector('.visits').dataset.session, visit = Number(e.target.dataset.visit);
    const r = await post('link?s=' + encodeURIComponent(s), { pid, visit });
    if (r.error) return toast('⚠ ' + r.error);
    toast(visit >= 0 ? 'Connected to that visit — names, exports and the catalogue are updated' : 'Added to the session');
    await load();
  }
  if (e.target.dataset.unlink) {
    if (!confirm('Remove them from this session?')) return;
    const r = await post('unlink?s=' + encodeURIComponent(e.target.dataset.unlink), { pid });
    if (r.error) return toast('⚠ ' + r.error);
    toast('Removed'); await load();
  }
});
$('zoom').onclick = () => ($('zoom').style.display = 'none');
load(); setInterval(() => { if (!document.querySelector('.p.linking') && !document.activeElement?.closest?.('.p')) load(); }, 15000);
</script>
<script src="nav.js"></script>
</body>
</html>
