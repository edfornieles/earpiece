<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111110"><title>Talk — Mother</title>
<style>
  :root { --bg:#111110; --card:#1c1c1a; --fg:#efeee9; --dim:#9a978e; --line:#353430; --hot:#ff8a3d; --ok:#7fb894; --bad:#e46f5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display:flex; flex-direction:column; min-height:100dvh; padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px); max-width:560px; margin:0 auto; }
  body > * { flex-shrink:0; }
  header { display:flex; align-items:center; gap:10px; padding:14px 0 10px; }
  header h1 { font-size:18px; font-weight:600; margin:0; flex:1; }
  header a { color:var(--dim); font-size:13px; text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); flex:0 0 auto; } .dot.on { background:var(--ok); }
  .label { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin:12px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { font:inherit; font-size:15px; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:22px; padding:9px 14px; min-height:44px; text-align:left; }
  .chips button small { display:block; font-size:11px; color:var(--dim); max-width:9.5em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chips button.sel { border-color:var(--fg); background:var(--fg); color:var(--bg); } .chips button.sel small { color:var(--bg); opacity:.7; }
  .chips button:disabled { opacity:.35; }
  .seg { display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .seg button { flex:1; font:inherit; font-size:15px; color:var(--fg); background:transparent; border:0; padding:12px 8px; min-height:48px; }
  .seg button.sel { background:var(--fg); color:var(--bg); font-weight:600; }
  .padwrap { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px 0 4px; min-height:0; }
  #hold { position:relative; width:min(46vw, 200px); aspect-ratio:1; border-radius:50%; border:0; font:inherit; font-size:21px; font-weight:600; color:var(--bg); background:var(--fg);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; box-shadow:0 0 0 0 var(--hot); transition:transform .08s, background .12s; }
  #hold small { display:block; font-size:13px; font-weight:400; opacity:.7; margin-top:4px; }
  #hold.on { background:var(--hot); color:#000; transform:scale(.97); }
  #hold.off { opacity:.4; }
  #hold.sending { background:var(--card); color:var(--fg); }
  #status { min-height:2.8em; text-align:center; color:var(--dim); font-size:14px; margin:10px 0 0; max-width:34em; }
  #status.warn { color:var(--bad); }
  .typed { display:flex; gap:8px; margin-top:6px; }
  .typed input { flex:1; min-width:0; font:inherit; font-size:16px; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 12px; }
  .typed button { font:inherit; font-weight:600; color:var(--bg); background:var(--fg); border:0; border-radius:10px; padding:0 16px; }
  #feed { list-style:none; padding:0; margin:6px 0 0; font-size:14px; color:var(--dim); max-height:24vh; overflow-y:auto; }
  #feed li { padding:6px 0; border-top:1px solid var(--line); } #feed li b { color:var(--fg); font-weight:500; }
  .screens { margin-top:2px; }
  .screen { position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
  .screen img:not([src]), .screen img[src=''] { visibility:hidden; }
  .screen img { width:100%; height:100%; object-fit:contain; display:block; }
  .screen .off { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; text-align:center; padding:10px; }
  .screen .tag { position:absolute; left:8px; bottom:6px; font-size:12px; color:#fff; text-shadow:0 1px 3px #000; }
  #screens.grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #screens.grid .screen { border-radius:8px; }
  #camtabs { margin-top:8px; } #camtabs button { padding:7px 12px; min-height:38px; font-size:14px; }
  #full { position:fixed; inset:0; background:#000; z-index:9; display:none; align-items:center; justify-content:center; } #full img { width:100%; height:100%; object-fit:contain; }
  #full span { position:absolute; top:calc(env(safe-area-inset-top) + 10px); right:14px; color:#fff; font-size:14px; background:rgba(0,0,0,.6); border-radius:8px; padding:6px 10px; }
  #nolink { background:var(--bad); color:#000; border-radius:10px; padding:10px 12px; font-size:14px; margin-top:6px; }
</style></head><body>
<header><span class="dot" id="dot" title="Connection to Mother"></span><h1>Talk to participants</h1><a id="desk" href="/control">Full desk</a></header>
<div id="nolink" hidden>Not connected to Mother yet. Trying again… If this stays, reload, or open the page in Chrome or Safari.</div>

<div class="label">Screens</div>
<div class="screens"><div id="screens"><div class="screen"><div class="off">Waiting for the cameras…</div></div></div>
<div class="chips" id="camtabs"></div></div>
<div class="padwrap">
  <button id="hold" aria-label="Hold to talk">Hold to talk<small id="holdsub">speak, then let go</small></button>
  <p id="status" role="status">Tap and hold the button, speak, then let go.</p>
</div>
<div id="full"><img alt="Camera, full screen"><span>Tap to close</span></div>

<div class="label">Who hears you</div>
<div class="chips" id="who"><button data-id="0" class="sel">Everyone<small>all connected phones</small></button></div>

<div class="label">They hear</div>
<div class="seg" id="as"><button data-as="voice" class="sel">AI voice</button><button data-as="own">My own voice</button></div>


<div class="label">Or type a line</div>
<form class="typed" id="typed"><input id="line" enterkeyhint="send" autocomplete="off" placeholder="They hear it in the AI voice"><button>Send</button></form>
<ul id="feed"></ul>

<script src="audio.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const KEY = new URLSearchParams(location.search).get('k');
const Q = KEY ? '?k=' + KEY : '';
$('desk').href = '/control' + Q;
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let ws, ctx, mic, micSetup, MAX = 0, phones = [], target = Number(store.get('talk-target') || 0), as = store.get('mother-mic-as') === 'own' ? 'own' : 'voice';
let talking = false, level = 0, fails = 0;

function status(text, warn) { $('status').textContent = text; $('status').classList.toggle('warn', !!warn); }
function feed(html) { const li = document.createElement('li'); li.innerHTML = html; $('feed').prepend(li); while ($('feed').children.length > 12) $('feed').lastChild.remove(); }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const whoName = (id) => id === 0 ? 'everyone' : 'phone ' + id;

// ---- who hears you ----
function paintWho() {
  const live = new Map(phones.map((p) => [p.id, p]));
  let html = `<button data-id="0" class="${target === 0 ? 'sel' : ''}">Everyone<small>${live.size ? live.size + ' connected' : 'no phone connected'}</small></button>`;
  for (let id = 1; id <= MAX; id++) {
    const p = live.get(id);
    html += `<button data-id="${id}" class="${target === id ? 'sel' : ''}" ${p ? '' : 'disabled'}>Phone ${id}<small>${p ? (p.waiting ? 'waiting' : esc(p.name || 'participant')) : 'not connected'}</small></button>`;
  }
  $('who').innerHTML = html;
}
$('who').onclick = (e) => { const b = e.target.closest('button[data-id]'); if (!b || b.disabled) return; target = Number(b.dataset.id); store.set('talk-target', target); paintWho(); paintAs(); };

// ---- how they hear you ----
function paintAs() {
  for (const b of $('as').children) b.classList.toggle('sel', b.dataset.as === as);
  $('holdsub').textContent = as === 'voice' ? 'speak, then let go' : 'they hear you live';
  if (!talking) status(as === 'voice'
    ? `Hold, speak, let go: ${whoName(target)} hears your words in the AI voice about 2 seconds later.`
    : `Hold and speak: ${whoName(target)} hears your own voice, live.`);
}
$('as').onclick = (e) => { const b = e.target.closest('button[data-as]'); if (!b) return; as = b.dataset.as; store.set('mother-mic-as', as); paintAs(); };

// ---- microphone ----
function micProblem(error) {
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return 'This page can only use the microphone over https. Open the mother.edfornieles.com link.';
  if (error?.name === 'NotAllowedError' || error?.name === 'SecurityError')
    return /iPhone|iPad/.test(navigator.userAgent) ? 'The microphone is blocked. Tap aA in the address bar → Website Settings → Microphone → Allow, then reload.'
      : 'The microphone is blocked. Tap the icon left of the address → Permissions → Microphone → Allow, then reload.';
  if (error?.name === 'NotReadableError') return 'Another app is using the microphone. Close it and try again.';
  return 'Microphone unavailable: ' + (error?.message || 'unknown problem') + '.';
}
function openMicrophone() {
  ctx ||= new AudioContext();
  const resumed = ctx.resume();   // inside the tap, before anything is awaited
  if (micSetup) return Promise.all([micSetup, resumed]);
  micSetup = (async () => {
    await ctx.audioWorklet.addModule('worklets.js');
    mic = await openMic(ctx);
    mic.onChunk((f) => {
      level = Math.max(level * 0.8, rms(f));
      if (!talking || !ws || ws.readyState !== 1) return;
      const i16 = floatToInt16(f), buf = new ArrayBuffer(2 + i16.byteLength);
      new Uint16Array(buf, 0, 1)[0] = target; new Int16Array(buf, 2).set(i16); ws.send(buf);
    });
    for (const t of mic.stream.getAudioTracks()) t.addEventListener('ended', () => { stop(); mic = null; micSetup = null; status('Microphone disconnected. Hold the button to turn it on again.', true); });
  })().catch((e) => { micSetup = null; throw e; });
  return Promise.all([micSetup, resumed]);
}
// Keep the screen awake while this page is open (a sleeping phone drops the microphone).
let lock = null;
async function stayAwake() { try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.onrelease = () => { lock = null; }; } } catch {} }

// ---- hold to talk ----
function start() {
  if (talking) return;
  if (!ws || ws.readyState !== 1) return status('Not connected to Mother yet.', true);
  if (target !== 0 && !phones.some((p) => p.id === target)) return status(`Phone ${target} is not connected.`, true);
  talking = true; $('hold').classList.add('on'); navigator.vibrate?.(15);
  ws.send(JSON.stringify({ type: 'talk', target: [target], on: true, as }));
  status(as === 'voice' ? 'Listening… let go when you have finished.' : `Live to ${whoName(target)}…`);
}
function stop() {
  if (!talking) return;
  talking = false; $('hold').classList.remove('on');
  if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'talk', target: [target], on: false, as }));
  if (as === 'voice') { $('hold').classList.add('sending'); status('Turning your words into the AI voice…'); clearTimeout(stop.t); stop.t = setTimeout(() => { $('hold').classList.remove('sending'); paintAs(); }, 6000); }
  else paintAs();
}
let held = false;
$('hold').addEventListener('pointerdown', (e) => {
  e.preventDefault(); held = true; stayAwake();
  try { $('hold').setPointerCapture(e.pointerId); } catch {}
  if (mic && ctx?.state === 'running') return start();
  status('Turning on the microphone…');
  openMicrophone().then(() => held ? start() : status('Microphone on. Now hold the button and speak.'),
    (err) => status(micProblem(err), true));
});
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) $('hold').addEventListener(ev, () => { held = false; stop(); });
$('hold').addEventListener('contextmenu', (e) => e.preventDefault());
// Leaving the page or locking the phone lets go of the button.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { held = false; stop(); } else stayAwake(); });
window.addEventListener('pagehide', () => { held = false; stop(); });

// ---- typed line ----
$('typed').onsubmit = (e) => {
  e.preventDefault(); const text = $('line').value.trim(); if (!text) return;
  if (!ws || ws.readyState !== 1) return status('Not connected to Mother yet.', true);
  const ids = target === 0 ? [0] : [target];
  for (const id of ids) ws.send(JSON.stringify({ type: 'speak', id, text }));
  feed(`<b>You typed → ${esc(whoName(target))}:</b> ${esc(text)}`); $('line').value = ''; $('line').blur();
};

// ---- screens: the studio cameras, one large (less phone data) or all of them ----
let cams = [], camPick = store.get('talk-cam') || '', camSrc = (id) => `/cam/${encodeURIComponent(id)}.mjpg${Q}${Q ? '&' : '?'}r=${Date.now()}`;
function screenEl(c) {
  const el = document.createElement('div'); el.className = 'screen'; el.dataset.id = c.id;
  el.innerHTML = '<img alt=""><div class="off">connecting…</div><div class="tag"></div>';
  el.querySelector('img').src = camSrc(c.id);
  el.onclick = () => { $('full').querySelector('img').src = camSrc(c.id); $('full').style.display = 'flex'; };
  return el;
}
function paintScreens() {
  const box = $('screens'), all = camPick === 'all', shown = all ? cams : [cams.find((c) => c.id === camPick) || cams[0]].filter(Boolean);
  if (!cams.length) { box.className = ''; box.innerHTML = '<div class="screen"><div class="off">No cameras are connected to Mother.</div></div>'; $('camtabs').innerHTML = ''; return; }
  box.className = all && cams.length > 1 ? 'grid' : '';
  const want = shown.map((c) => c.id).join('|');
  if (box.dataset.showing !== want || document.visibilityState === 'hidden') {   // only rebuild (restart the streams) when the choice changes
    box.innerHTML = ''; box.dataset.showing = document.visibilityState === 'hidden' ? '' : want;
    if (document.visibilityState !== 'hidden') for (const c of shown) box.appendChild(screenEl(c));
  }
  for (const c of shown) {
    const el = box.querySelector(`.screen[data-id="${CSS.escape(c.id)}"]`); if (!el) continue;
    el.querySelector('.tag').textContent = c.name + (c.recording ? ' · ● REC' : '');
    const off = el.querySelector('.off'); off.style.display = c.live ? 'none' : 'flex';
    if (!c.live) { off.textContent = 'no picture — reconnecting…'; if (!el.retry || Date.now() - el.retry > 5000) { el.retry = Date.now(); el.querySelector('img').src = camSrc(c.id); } }
  }
  const sel = all ? 'all' : (shown[0]?.id || '');
  $('camtabs').innerHTML = cams.map((c) => `<button data-cam="${esc(c.id)}" class="${sel === c.id ? 'sel' : ''}">${esc(c.name)}</button>`).join('')
    + (cams.length > 1 ? `<button data-cam="all" class="${all ? 'sel' : ''}">All</button>` : '');
}
$('camtabs').onclick = (e) => { const b = e.target.closest('button[data-cam]'); if (!b) return; camPick = b.dataset.cam; store.set('talk-cam', camPick); paintScreens(); };
$('full').onclick = () => { $('full').style.display = 'none'; $('full').querySelector('img').src = ''; };
// A hidden page stops its camera streams (phone data, battery) and starts them again when shown.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { $('screens').innerHTML = ''; $('screens').dataset.showing = ''; } paintScreens(); });

// ---- connection ----
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=control&k=${KEY || ''}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { fails = 0; $('dot').classList.add('on'); $('nolink').hidden = true; };
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') return;   // participants' audio: this page does not play it (no echo in your headphones)
    const m = JSON.parse(e.data);
    if (m.type === 'cameras') { cams = m.list; paintScreens(); }
    if (m.type === 'phonesChanged') { MAX = m.maxPhones; paintWho(); }
    if (m.type === 'participants') { phones = m.list; paintWho(); }
    if (m.type === 'error') { clearTimeout(stop.t); $('hold').classList.remove('sending'); status(m.text, true); }
    if (m.type === 'transcript' && (m.who === 'director' || m.who === 'voiced')) { clearTimeout(stop.t); $('hold').classList.remove('sending'); status('Sent. ' + (as === 'voice' ? 'They heard it in the AI voice.' : '')); feed(`<b>You → phone ${m.id}:</b> ${esc(m.text)}`); }
    if (m.type === 'transcript' && m.who === 'note' && /Rehearsal|not connected|nobody/i.test(m.text)) feed(esc(m.text));
  };
  ws.onclose = () => {
    $('dot').classList.remove('on'); held = false; stop();
    fails++; if (fails >= 3) $('nolink').hidden = false;
    setTimeout(connect, Math.min(5000, 500 * fails));
  };
}
paintWho(); paintAs(); connect();
(function draw() { level *= 0.9; const g = Math.min(28, level * 260); $('hold').style.boxShadow = talking ? `0 0 0 ${g}px rgba(255,138,61,.35)` : 'none'; requestAnimationFrame(draw); })();
</script></body></html>
