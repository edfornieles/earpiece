<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trash</title>
<style>
  :root { --bg:#0e0e0e; --card:#171717; --line:#2a2a2a; --fg:#e8e6e1; --dim:#8a8780; --hot:#d9482b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, system-ui, sans-serif; }
  header { padding:12px 22px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; }
  header h1 { font-size:15px; font-weight:500; margin:0; }
  header .hint { flex:1; }
  button { font:inherit; background:#222; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover { border-color:#444; } button.danger { color:#e88; }
  main { padding:18px 22px 60px; max-width:1100px; }
  .hint { color:var(--dim); font-size:12px; }
  .item { display:grid; grid-template-columns: 110px 1fr 90px 150px auto; gap:12px; align-items:center; padding:10px 6px; border-bottom:1px solid #1f1f1f; }
  .kind { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .sz, .at { color:var(--dim); font-size:12px; text-align:right; }
  .act { display:flex; gap:6px; justify-content:flex-end; }
  .empty { color:var(--dim); padding:30px 0; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#222; border:1px solid var(--line); padding:8px 14px; border-radius:8px; display:none; }
</style>
</head>
<body>
<header><h1>Trash</h1><span class="hint">Deleted sessions, files and registrations wait here. Restore puts them back where they were. Nothing is gone for good until you delete it here.</span><button class="danger" id="empty">Empty trash…</button></header>
<main id="list"><div class="empty">Loading…</div></main>
<div id="toast"></div>
<script>
const KEY = new URLSearchParams(location.search).get('k');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const api = (p, body) => fetch(`/api/${p}?k=${KEY}`, body ? { method: 'POST', body: JSON.stringify(body) } : {}).then((r) => r.json());
const size = (b) => b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : b > 1e3 ? Math.round(b / 1e3) + ' KB' : b + ' B';
function toast(t) { $('toast').textContent = t; $('toast').style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => ($('toast').style.display = 'none'), 2200); }
const KIND = { session: 'Session', files: 'Files', registration: 'Registration' };
let items = [];
async function load() {
  items = (await api('trash')).items || [];
  const total = items.reduce((a, t) => a + (t.size || 0), 0);
  $('empty').disabled = !items.length;
  $('list').innerHTML = items.length ? `<p class="hint">${items.length} item${items.length === 1 ? '' : 's'} · ${size(total)}</p>` + items.map((t) => `<div class="item" data-id="${esc(t.id)}">
    <span class="kind">${KIND[t.kind] || t.kind}</span><span>${esc(t.label)}</span><span class="sz">${size(t.size || 0)}</span>
    <span class="at">${new Date(t.at).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
    <span class="act"><button data-a="restore">Restore</button><button data-a="purge" class="danger">Delete forever</button></span></div>`).join('')
    : '<div class="empty">The trash is empty.</div>';
}
$('list').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.closest('.item').dataset.id, t = items.find((x) => x.id === id);
  if (b.dataset.a === 'restore') { const r = await api('trash-restore', { id }); toast(r.error ? '⚠ ' + r.error : 'Restored'); }
  if (b.dataset.a === 'purge') {
    if (!confirm(`Delete “${t.label}” for good? This can't be undone.`)) return;
    const r = await api('trash-purge', { id }); toast(r.error ? '⚠ ' + r.error : 'Deleted for good');
  }
  load();
});
$('empty').onclick = async () => {
  if (!confirm(`Delete everything in the trash for good (${items.length} items)? This can't be undone.`)) return;
  const r = await api('trash-purge', {}); toast(r.error ? '⚠ ' + r.error : 'Trash emptied'); load();
};
load();
</script>
<script src="nav.js"></script>
</body>
</html>
